name: Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

jobs:
  build-pages:
    name: Build documentation and playgrounds
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.freshness.outputs.deploy }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check verified revision is current
        id: freshness
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(git rev-parse HEAD)"
          if [[ -z "$VERIFIED_SHA" || "$VERIFIED_SHA" == "$current_sha" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          non_release_commits="$(git log --format=%s "$VERIFIED_SHA..HEAD" | grep -v '\[skip ci\]' || true)"
          if git merge-base --is-ancestor "$VERIFIED_SHA" HEAD && [[ -z "$non_release_commits" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "deploy=false" >> "$GITHUB_OUTPUT"
          echo "Skipping stale CI revision $VERIFIED_SHA; current main is $current_sha."

      - name: Setup pnpm
        if: steps.freshness.outputs.deploy == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install dependencies
        if: steps.freshness.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build Pages artifact
        if: steps.freshness.outputs.deploy == 'true'
        run: pnpm build:pages
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/pages

  deploy-pages:
    name: Deploy GitHub Pages
    if: needs.build-pages.outputs.deploy == 'true'
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

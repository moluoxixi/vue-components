name: CI

on:
  pull_request:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck ConfigForm Workbench
        run: pnpm --filter @config-form/workbench typecheck

      - name: Verify package architecture
        run: pnpm test:package-architecture

      - name: Test
        run: pnpm test

      - name: Test ConfigForm Workbench
        run: pnpm test:config-form-workbench

      - name: Verify ConfigForm Workbench templates
        run: pnpm test:config-form-workbench-templates

      - name: Test release automation
        run: pnpm test:release

      - name: Validate workflows
        run: pnpm lint:workflows

      - name: Coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Build ConfigForm Workbench
        run: pnpm --filter @config-form/workbench build

      - name: Build docs
        run: pnpm build:docs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify packed packages
        run: pnpm test:pack

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:83192064c7510f7ee73dd63dc5f22a5e01a92c81a2e6a9c715d9e3fe55471fd9
      options: --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Test packed packages in Chromium
        run: pnpm test:pack:browser

      - name: Test AI doc assistant
        run: pnpm --filter @moluoxixi/ai-doc-assistant e2e

      - name: Test ConfigForm playground
        run: pnpm -C packages/ConfigForm/playground test:e2e

      - name: Test ConfigForm Workbench
        run: pnpm --filter @config-form/workbench test:e2e

      - name: Test components playground
        run: pnpm -C playgrounds/components-playground test:e2e

      - name: Test documentation theme
        run: pnpm -C packages/vitepress-theme-element-plus test:e2e:functional

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-diagnostics-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/ConfigForm/playground/dist/playwright-report/config-form-playground
            packages/ConfigForm/playground/dist/test-results/config-form-playground
            packages/ConfigForm/workbench/dist/playwright-report/config-form-workbench
            packages/ConfigForm/workbench/dist/test-results/config-form-workbench
            playgrounds/components-playground/dist/playwright-report/components-playground
            playgrounds/components-playground/dist/test-results/components-playground
            packages/ai-doc-assistant/.playwright/report
            packages/ai-doc-assistant/.playwright/test-results
            packages/vitepress-theme-element-plus/.playwright/report
            packages/vitepress-theme-element-plus/.playwright/test-results

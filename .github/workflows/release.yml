name: Release packages

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

jobs:
  release:
    name: Version and publish changed packages
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: npm-release
      cancel-in-progress: false
    environment:
      name: npm

    steps:
      - name: Checkout latest main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Check verified revision is current
        id: freshness
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ -z "$VERIFIED_SHA" || "$VERIFIED_SHA" == "$(git rev-parse HEAD)" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "release=false" >> "$GITHUB_OUTPUT"
          echo "Skipping stale CI revision $VERIFIED_SHA; current main is $(git rev-parse HEAD)."

      - name: Setup pnpm
        if: steps.freshness.outputs.release == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        if: steps.freshness.outputs.release == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: steps.freshness.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Create patch changesets for changed packages
        if: steps.freshness.outputs.release == 'true'
        run: pnpm release:changesets
        env:
          AUTO_CHANGESET_HEAD: HEAD

      - name: Version packages
        if: steps.freshness.outputs.release == 'true'
        run: pnpm version-packages

      - name: Commit release metadata
        if: steps.freshness.outputs.release == 'true'
        run: |
          if git diff --quiet; then
            echo "No release metadata changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore(release): version packages [skip ci]"
          git push origin HEAD:main

      - name: Publish packages
        if: steps.freshness.outputs.release == 'true'
        run: pnpm release
        env:
          NPM_CONFIG_PROVENANCE: true
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push release tags
        if: steps.freshness.outputs.release == 'true'
        run: git push origin --tags
